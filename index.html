<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Arifcan Demirci, Mechatronics Engineer. Robotics software, autonomous mobile robots, and real-world systems. View my CV and connect.">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="https://arifcandemirci.github.io/">
  <title>Arifcan Demirci</title>
  <style>
    :root { color-scheme: light; --ink: #182b3a; --muted: #52616a; --line: #dce2e5; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; -webkit-font-smoothing: antialiased; }
    main { width: min(100% - 96px, 960px); min-height: 100vh; min-height: 100svh; margin: 0 auto; display: flex; flex-direction: column; justify-content: center; padding: 88px 0; }
    header { border-top: 2px solid var(--ink); padding: 52px 0 48px; }
    h1 { margin: 0 0 24px; font-family: Georgia, "Times New Roman", serif; font-size: clamp(3rem, 6.8vw, 5rem); font-weight: 400; line-height: 1.08; letter-spacing: -0.055em; }
    .subtitle { margin: 0; color: var(--muted); font-size: 0.95rem; line-height: 1.7; letter-spacing: 0.025em; }
    .overview { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; column-gap: 80px; border-top: 1px solid var(--line); padding: 40px 0 48px; }
    .intro { max-width: 570px; margin: 0; color: var(--muted); font-size: 1.125rem; line-height: 1.85; }
    .cv { display: inline-flex; align-items: center; justify-content: center; gap: 24px; min-height: 52px; padding: 13px 24px; border: 1px solid var(--ink); border-radius: 3px; background: var(--ink); color: #fff; text-decoration: none; font-size: 0.9rem; font-weight: 600; line-height: 1.5; white-space: nowrap; transition: background 160ms ease; }
    .cv:hover { background: #304b5e; }
    .arrow { font-size: 1.1rem; font-weight: 400; line-height: 1; }
    nav { display: flex; flex-wrap: wrap; gap: 32px; border-top: 1px solid var(--line); padding-top: 24px; }
    nav a { display: inline-flex; align-items: center; gap: 10px; min-height: 44px; color: var(--muted); font-size: 0.875rem; line-height: 1.5; text-decoration: none; }
    nav a:hover { color: var(--ink); text-decoration: underline; text-underline-offset: 5px; }
    a:focus-visible { outline: 2px solid #32688c; outline-offset: 6px; }
    @media (max-width: 700px) {
      main { width: calc(100% - 48px); padding: 56px 0; }
      header { padding: 36px 0 32px; }
      h1 { font-size: clamp(2.75rem, 10.5vw, 4rem); margin-bottom: 20px; }
      .subtitle { font-size: 0.875rem; max-width: 300px; }
      .overview { grid-template-columns: 1fr; gap: 28px; padding: 28px 0 36px; }
      .intro { font-size: 1rem; line-height: 1.8; }
      .cv { justify-self: start; }
      nav { padding-top: 16px; }
    }
    @media (prefers-reduced-motion: reduce) { .cv { transition: none; } }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Arifcan Demirci</h1>
      <p class="subtitle">Mechatronics Engineer | Robotics &amp; Software</p>
    </header>
    <div class="overview">
      <p class="intro">I develop software for autonomous mobile robots, bringing together sensing, navigation, and control. My work spans C++, Python, ROS, and ROS 2, from simulation to validation on real systems.</p>
      <a class="cv" href="./Arifcan_Demirci_CV.pdf" target="_blank" rel="noopener noreferrer">View CV <span class="arrow" aria-hidden="true">↗</span></a>
    </div>
    <nav aria-label="Connect">
      <a href="https://github.com/arifcandemirci" target="_blank" rel="noopener noreferrer">GitHub <span aria-hidden="true">↗</span></a>
      <a href="https://www.linkedin.com/in/arifcan-demirci-mechatronics/" target="_blank" rel="noopener noreferrer">LinkedIn <span aria-hidden="true">↗</span></a>
    </nav>
  </main>
</body>
</html>
